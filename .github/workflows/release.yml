name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ide_url:
        description: "Optional override: JetBrains IDE (Windows zip) download URL. Leave empty to auto-resolve the latest IntelliJ IDEA Community release."
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve & download IntelliJ Platform IDE (platform jars + bundled JDK)
        shell: pwsh
        run: |
          $url = "${{ github.event.inputs.ide_url }}"
          if (-not $url) {
            # Resolve the latest IntelliJ IDEA Community (IIC) Windows zip from the
            # official JetBrains releases API instead of hardcoding a version URL.
            $api = Invoke-RestMethod "https://data.services.jetbrains.com/products/releases?code=IIC&latest=true&type=release" -TimeoutSec 60
            $release = $api.IIC | Select-Object -First 1
            $dl = $release.downloads.PSObject.Properties.Value | Where-Object { $_.link -like "*.zip" } | Select-Object -First 1
            $url = $dl.link
          }
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ide.zip
          Expand-Archive ide.zip -DestinationPath ide

      - name: Build plugin
        shell: pwsh
        run: |
          $ide = Get-ChildItem ide -Directory | Select-Object -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -IdeRoot $ide.FullName

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-web-jetbrains-toolwindow
          path: releases/dsh-web-jetbrains-toolwindow.jar

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/dsh-web-jetbrains-toolwindow.jar
            releases/dsh-web-jetbrains-toolwindow.zip
